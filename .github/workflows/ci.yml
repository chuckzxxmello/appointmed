name: E2E Testing CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'yarn'

      - name: Install Dependencies
        run: yarn install

      - name: Start Live Server
        run: npx live-server --port=5500 --no-browser &
        
      - name: Wait for server to be ready
        run: sleep 3
        
      - name: Run Nightwatch Tests (Headless)
        run: npx nightwatch tests/loginTest.js --env chrome
        env:
          NIGHTWATCH_HEADLESS: 1
