name: E2E Testing CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install Dependencies
        run: yarn install --frozen-lockfile

      - name: Start Live Server and Run Tests
        run: |
          npx live-server --port=5500 --no-browser &
          sleep 5
          npx nightwatch tests/loginTest.js --env chrome --headless
        env:
          NIGHTWATCH_HEADLESS: 1
