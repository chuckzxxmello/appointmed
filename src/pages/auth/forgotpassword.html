<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - AppointMED</title>
      
    <!-- Favicon and App Icons -->
    <link rel="icon" href="../../assets/images/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="../../assets/images/favicon.ico" type="image/x-icon">
    
    <!-- Google Fonts Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="../../styles/login.css">  
    
    <!-- Authentication Module -->
    <script type="module" src="../../scripts/forgotpassword.js"></script>
</head>

<body>
    <main class="auth-page-wrapper">
        <div class="auth-header-brand">
            <img src="../../assets/images/apple-touch-icon.png" alt="AppointMED Logo" class="auth-logo-img" width="48" height="48" />
            <h1>Reset Password</h1>
            <p>Securely regain access to your account</p>
        </div>

        <section class="login-container" style="display: block;">
            <div class="card-header">
                <h2>Forgot Password?</h2>
                <p>Enter your email address and we'll send you a secure link to reset your password.</p>
            </div>

            <form id="forgotPasswordForm" novalidate>
                <div class="form-group">
                    <label for="reset-email">Email Address</label>
                    <input id="reset-email" type="email" name="email" placeholder="Enter your registered email" required maxlength="100" autocomplete="email" />
                </div>

                <!-- Accessibility Live Region for Messages -->
                <div id="message" class="error-message" aria-live="polite" role="status"></div>
                <div id="loadingSpinner" class="loading-spinner hidden">Sending Reset Link...</div>
        
                <button id="submitReset" type="submit" class="btn-auth-primary">Send Reset Link</button>
            </form>

            <div class="card-footer-switch" style="margin-top: 1.5rem;">
                <p><a href="login.html" class="btn-link-switch" style="text-decoration: none;">&larr; Back to Login</a></p>
            </div>
        </section>
    </main>
</body>
</html>
