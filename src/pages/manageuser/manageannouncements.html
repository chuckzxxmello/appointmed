<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AppointMED - Manage Announcements</title>

  <!-- Favicon and app icons -->
  <link rel="icon" href="../../assets/images/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="../../assets/images/favicon.ico" type="image/x-icon">
  <link rel="apple-touch-icon" href="../../assets/images/apple-touch-icon.png">
  <link rel="manifest" href="../../assets/images/site.webmanifest">

  <!-- Google Fonts Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Unified Admin Design System -->
  <link rel="stylesheet" href="../../styles/admin.css">
</head>

<body>

  <!-- Navigation Header -->
  <header class="admin-header">
    <div class="admin-nav-container">
      <a href="adminhome.html" class="admin-brand">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1e3a8a" stroke-width="2"
          style="margin-right: 0.2rem;">
          <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
          <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
        </svg>
        <div class="admin-brand-text">
          <h2>Announcements</h2>
          <p>Admin Panel</p>
        </div>
      </a>

      <div class="admin-nav-actions">
        <div class="nav-user-badge">
          Welcome, <strong id="adminDisplayName">Admin</strong>
        </div>

        <button type="button" id="adminLogoutBtn" class="btn-admin-pill btn-pill-danger">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
          Sign Out
        </button>

        <a href="adminhome.html" class="btn-admin-pill btn-pill-primary">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
          Back to Admin
        </a>
      </div>
    </div>
  </header>

  <!-- Main Content Container -->
  <main class="admin-main-container">

    <!-- Page Header -->
    <div class="admin-page-header">
      <h1 class="admin-page-title">Manage Announcements</h1>
      <p class="admin-page-subtitle">Configure Facebook embedded highlights and Patient Portal alerts.</p>
    </div>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; align-items: start;">
      


      <!-- 2. Facebook Reviews -->
      <div class="content-card" style="margin-bottom: 0;">
        <div class="content-card-header">
          <div class="card-title-group">
            <h2>Facebook Reviews</h2>
            <p>Embed reviews for the homepage contact section (Maximum 10)</p>
          </div>
        </div>
        <form id="reviewsForm" style="padding: 1rem 0;">
          <div id="reviewsContainer" style="display: flex; flex-direction: column; gap: 1rem;"></div>
          <button type="button" id="addReviewBtn" style="margin-top: 1rem; padding: 0.5rem 1rem; border: 1px dashed #cbd5e1; background: transparent; color: #475569; border-radius: 0.375rem; cursor: pointer; width: 100%;">+ Add Review</button>
          <div style="display: flex; justify-content: flex-end; margin-top: 1.5rem;">
            <button type="submit" id="saveReviewsBtn" class="btn-admin-pill btn-pill-primary">Save Reviews</button>
          </div>
        </form>
      </div>



      <!-- System Alerts -->
      <div class="content-card" style="margin-bottom: 0;">
        <div class="content-card-header">
          <div class="card-title-group">
            <h2>System Alerts</h2>
            <p>Configure announcements for logged-in users.</p>
          </div>
        </div>
        <form id="portalAlertForm" style="padding: 1rem 0;">
          <div id="alertsContainer" style="display: flex; flex-direction: column; gap: 1.5rem;"></div>
          <button type="button" id="addAlertBtn" style="margin-top: 1rem; padding: 0.5rem 1rem; border: 1px dashed #cbd5e1; background: transparent; color: #475569; border-radius: 0.375rem; cursor: pointer; width: 100%;">+ Add Portal Alert</button>
          <div style="display: flex; justify-content: flex-end; margin-top: 1.5rem;">
            <button type="submit" id="savePortalBtn" class="btn-admin-pill btn-pill-primary">Save All Alerts</button>
          </div>
        </form>
      </div>

    </div>

  </main>

  <script type="module" src="../../scripts/manageannouncements.js"></script>
</body>
</html>
